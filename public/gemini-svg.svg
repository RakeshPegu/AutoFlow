<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" class="w-full h-auto drop-shadow-2xl">
  <defs>
    <!-- Gradients for 3D depth -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="teal-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>

    <linearGradient id="glass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>

    <!-- Filters for Glow & Soft Shadows -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .floating-layer { animation: float 6s ease-in-out infinite; }
    .floating-badge { animation: float 4s ease-in-out infinite alternate; }
    .pulse-glow { animation: pulse 3s infinite alternate; }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
    }
    @keyframes pulse {
      0% { opacity: 0.4; }
      100% { opacity: 0.9; }
    }
  </style>

  <!-- Background Ambient Glow -->
  <circle cx="400" cy="300" r="220" fill="#818cf8" opacity="0.15" filter="url(#glow)" />

  <!-- BASE 3D PLATFORM LAYER -->
  <g filter="url(#shadow)">
    <!-- Base Top Surface -->
    <path d="M 400 160 L 680 300 L 400 440 L 120 300 Z" fill="url(#primary-grad)" />
    <!-- Base Left Thickness -->
    <path d="M 120 300 L 400 440 L 400 460 L 120 320 Z" fill="#3730a3" />
    <!-- Base Right Thickness -->
    <path d="M 400 440 L 680 300 L 680 320 L 400 460 Z" fill="#312e81" />
  </g>

  <!-- Grid Lines on Platform -->
  <g opacity="0.25" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="6,6">
    <path d="M 260 230 L 540 370" />
    <path d="M 330 195 L 610 335" />
    <path d="M 260 370 L 540 230" />
    <path d="M 190 335 L 470 195" />
  </g>

  <!-- FLOATING GLASSMorphism UI CARD LAYER -->
  <g class="floating-layer" filter="url(#shadow)">
    <!-- Glass Plate -->
    <path d="M 400 110 L 620 220 L 400 330 L 180 220 Z" fill="url(#glass-grad)" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.5" />
    
    <!-- 3D Pillar Supports connecting Base & Glass -->
    <path d="M 280 270 L 280 220" stroke="#60a5fa" stroke-width="3" opacity="0.6" stroke-dasharray="3,3" />
    <path d="M 520 270 L 520 220" stroke="#60a5fa" stroke-width="3" opacity="0.6" stroke-dasharray="3,3" />
    <path d="M 400 330 L 400 280" stroke="#60a5fa" stroke-width="3" opacity="0.6" stroke-dasharray="3,3" />
  </g>

  <!-- 3D DATA / LEAD NODES & PIPELINE -->
  <!-- Central Glowing Orb (Lead Collector) -->
  <g class="floating-layer">
    <!-- Orb Glow -->
    <ellipse cx="400" cy="220" rx="35" ry="20" fill="#38bdf8" class="pulse-glow" filter="url(#glow)" />
    <!-- 3D Sphere -->
    <circle cx="400" cy="210" r="22" fill="url(#teal-grad)" />
    <ellipse cx="393" cy="202" rx="8" ry="4" fill="#ffffff" opacity="0.6" />
  </g>

  <!-- LEFT 3D FLOATING BADGE (Step 1: Sign Up) -->
  <g class="floating-badge" filter="url(#shadow)">
    <path d="M 160 180 L 260 230 L 260 260 L 160 210 Z" fill="url(#accent-grad)" />
    <path d="M 260 230 L 270 225 L 270 255 L 260 260 Z" fill="#b45309" />
    <text x="210" y="222" font-family="sans-serif" font-weight="bold" font-size="13" fill="#ffffff" text-anchor="middle">⚡ 10k+ Leads</text>
  </g>

  <!-- RIGHT 3D FLOATING CODE/API BLOCK -->
  <g class="floating-badge" filter="url(#shadow)" style="animation-delay: -2s;">
    <!-- Top Face -->
    <path d="M 540 180 L 660 240 L 560 290 L 440 230 Z" fill="#0f172a" opacity="0.9" stroke="#38bdf8" stroke-width="1" />
    <!-- Left Face -->
    <path d="M 440 230 L 560 290 L 560 300 L 440 240 Z" fill="#0284c7" />
    <!-- Code Lines -->
    <path d="M 480 235 L 540 265" stroke="#4ade80" stroke-width="3" stroke-linecap="round" />
    <path d="M 500 250 L 580 290" stroke="#f43f5e" stroke-width="3" stroke-linecap="round" />
    <path d="M 530 235 L 610 275" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- FRONT FLOATING SUCCESS BADGE -->
  <g class="floating-layer" filter="url(#shadow)" style="animation-delay: -1s;">
    <rect x="330" y="340" width="140" height="42" rx="21" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />
    <circle cx="355" cy="361" r="12" fill="#22c55e" />
    <path d="M 350 361 L 354 365 L 361 357" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <text x="377" y="366" font-family="sans-serif" font-weight="bold" font-size="13" fill="#0f172a">API Connected</text>
  </g>
</svg>
